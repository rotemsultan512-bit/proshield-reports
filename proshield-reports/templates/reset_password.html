<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14517d">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>איפוס סיסמה - Proshield Reports</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/icon-192.png">
    <link rel="stylesheet" href="/static/css/style.css?v=20261012-03">
    <link rel="stylesheet" href="/static/css/field-ui.css?v=20261013-03">
</head>
<body class="login-page password-reset-page">
    <main class="login-container">
        <div class="login-card reset-card">
            <div class="login-header">
                <div class="login-logo"><img src="/static/images/proshield-icon.png" alt="Proshield"></div>
                <h1>איפוס סיסמה</h1>
                <p>יש לבקש קוד איפוס מהמנהל. הקוד תקף ל־30 דקות ולשימוש אחד.</p>
            </div>

            <form id="resetPasswordForm" class="login-form">
                <div class="form-group">
                    <label for="resetUsername">שם משתמש</label>
                    <input type="text" id="resetUsername" required autocomplete="username" maxlength="80">
                </div>
                <div class="form-group">
                    <label for="resetCode">קוד שקיבלת מהמנהל</label>
                    <input type="text" id="resetCode" required autocomplete="one-time-code" maxlength="64" dir="ltr">
                </div>
                <div class="form-group">
                    <label for="resetNewPassword">סיסמה חדשה</label>
                    <input type="password" id="resetNewPassword" required minlength="8" autocomplete="new-password">
                    <small>לפחות 8 תווים</small>
                </div>
                <div class="form-group">
                    <label for="resetConfirmPassword">אימות סיסמה חדשה</label>
                    <input type="password" id="resetConfirmPassword" required minlength="8" autocomplete="new-password">
                </div>
                <p class="form-error" id="resetError" role="alert" style="display:none;"></p>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetSubmit">שמור סיסמה חדשה</button>
            </form>
            <div class="reset-success" id="resetSuccess" role="status" style="display:none;">
                <p>הסיסמה עודכנה. אפשר להתחבר עם הסיסמה החדשה.</p>
                <a href="{{ url_for('login') }}" class="btn btn-primary btn-block">מעבר לכניסה</a>
            </div>
            <a class="password-recovery-link" href="{{ url_for('login') }}">חזרה למסך הכניסה</a>
        </div>
    </main>

    <script>
        const resetForm = document.getElementById('resetPasswordForm');
        const resetError = document.getElementById('resetError');
        const resetSubmit = document.getElementById('resetSubmit');
        resetForm.addEventListener('submit', async event => {
            event.preventDefault();
            resetError.style.display = 'none';
            const newPassword = document.getElementById('resetNewPassword').value;
            if (newPassword !== document.getElementById('resetConfirmPassword').value) {
                resetError.textContent = 'הסיסמאות החדשות אינן תואמות';
                resetError.style.display = 'block';
                return;
            }
            resetSubmit.disabled = true;
            try {
                const response = await fetch('/api/password-reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                    },
                    body: JSON.stringify({
                        username: document.getElementById('resetUsername').value.trim(),
                        code: document.getElementById('resetCode').value.trim(),
                        new_password: newPassword
                    })
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'לא ניתן לאפס את הסיסמה');
                resetForm.style.display = 'none';
                document.getElementById('resetSuccess').style.display = 'block';
            } catch (error) {
                resetError.textContent = error.message || 'שגיאת תקשורת. נסו שוב.';
                resetError.style.display = 'block';
            } finally {
                resetSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
