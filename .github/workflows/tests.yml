name: Application checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: proshield-reports/requirements.txt
      - name: Install dependencies
        run: pip install -r proshield-reports/requirements.txt
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Check production database driver
        run: python -c "from sqlalchemy.dialects.postgresql.psycopg import PGDialect_psycopg; PGDialect_psycopg.import_dbapi()"
      - name: Check browser scripts
        run: |
          node --check proshield-reports/static/js/offline-queue.js
          node --check proshield-reports/static/js/sw.js
